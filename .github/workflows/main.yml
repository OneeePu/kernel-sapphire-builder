name: Build Xiaomi Sapphire Kernel
on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel Source Repository'
        required: true
        default: 'https://github.com/OneeePu/kernel_xiaomi_sapphire'
        type: string
      kernel_branch:
        description: 'Kernel Branch'
        required: true
        default: 'lineage-23.2'
        type: string
      defconfig:
        description: 'Defconfig (boleh lebih dari satu, pisah spasi; kosong = auto-detect)'
        required: false
        default: ''
        type: string
      clang_repo:
        description: 'Custom Clang Repo (dipakai jika Clang Version = custom-repo)'
        required: false
        default: 'https://github.com/onettboots/update-alternative-clang'
        type: string
      clang_branch:
        description: 'Custom Clang Branch (kosong = default branch)'
        required: false
        default: ''
        type: string
      clang_version:
        description: 'Clang Toolchain Version'
        required: true
        default: 'custom-repo'
        type: choice
        options:
          - 'custom-repo'
          - 'r510928'
          - 'r487747c'
          - 'r450784d'
          - 'proton-clang'
      ksu_variant:
        description: 'KernelSU Variant'
        required: true
        default: 'KernelSU'
        type: choice
        options:
          - 'KernelSU'
          - 'KernelSU-Next'
          - 'None'

jobs:
  build-kernel:
    name: Build Sapphire Kernel (${{ inputs.ksu_variant }})
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 20480
          temp-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio zip curl git \
            python3 lz4 xz-utils ccache device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone Kernel Source
        run: |
          REPO="${{ inputs.kernel_repo }}"
          BRANCH="${{ inputs.kernel_branch }}"
          echo "Branch tersedia:"
          git ls-remote --heads "$REPO" | sed 's|.*refs/heads/||'
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads "$REPO" "$BRANCH" >/dev/null; then
            git clone --depth=1 -b "$BRANCH" "$REPO" kernel
          else
            echo "::warning::Branch '$BRANCH' tidak ada, pakai default branch"
            git clone --depth=1 "$REPO" kernel
          fi
          echo "Branch dipakai: $(git -C kernel branch --show-current)"
          echo "--- configs ---"
          ls kernel/arch/arm64/configs kernel/arch/arm64/configs/vendor 2>/dev/null || true

      - name: Setup Clang
        run: |
          mkdir -p clang
          if [ "${{ inputs.clang_version }}" = "custom-repo" ]; then
            CB="${{ inputs.clang_branch }}"
            if [ -n "$CB" ]; then
              git clone --depth=1 -b "$CB" "${{ inputs.clang_repo }}" clang-src
            else
              git clone --depth=1 "${{ inputs.clang_repo }}" clang-src
            fi
            echo "--- isi repo clang ---"
            ls -la clang-src
            CLANG_BIN="$(find clang-src -type f -path '*/bin/clang' | head -n1)"
            if [ -z "$CLANG_BIN" ]; then
              echo "::error::bin/clang tidak ditemukan di repo clang. Cek isi repo di log."
              exit 1
            fi
            CLANG_DIR="$(cd "$(dirname "$CLANG_BIN")/.." && pwd)"
            chmod -R +x "$CLANG_DIR/bin"
            echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
            "$CLANG_DIR/bin/clang" --version | head -n1
          elif [ "${{ inputs.clang_version }}" = "proton-clang" ]; then
            git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
            echo "$PWD/clang/bin" >> "$GITHUB_PATH"
            "$PWD/clang/bin/clang" --version | head -n1
          else
            if curl -fL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-${{ inputs.clang_version }}.tar.gz" -o clang.tar.gz; then
              tar -xzf clang.tar.gz -C clang
            else
              echo "::warning::Clang ${{ inputs.clang_version }} tidak ditemukan, pakai proton-clang"
              rm -rf clang
              git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
            fi
            echo "$PWD/clang/bin" >> "$GITHUB_PATH"
            "$PWD/clang/bin/clang" --version | head -n1
          fi

      - name: Add KernelSU
        if: inputs.ksu_variant != 'None'
        working-directory: kernel
        run: |
          if [ "${{ inputs.ksu_variant }}" = "KernelSU-Next" ]; then
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          else
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          fi

      - name: Build Kernel
        working-directory: kernel
        run: |
          set -o pipefail
          CFG="${{ inputs.defconfig }}"
          FIRST="${CFG%% *}"
          if [ -z "$FIRST" ] || [ ! -f "arch/arm64/configs/$FIRST" ]; then
            echo "::warning::Defconfig '$FIRST' tidak ditemukan, auto-detect..."
            CFG="$(cd arch/arm64/configs && find . -type f -iname '*sapphire*' | sed 's|^\./||' | sort | head -n1)"
            if [ -z "$CFG" ]; then
              echo "::error::Tidak ada defconfig sapphire. Isi input defconfig manual."
              ls arch/arm64/configs arch/arm64/configs/vendor 2>/dev/null
              exit 1
            fi
          fi
          echo "Defconfig dipakai: $CFG"

          MAKE_ARGS="O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make $MAKE_ARGS $CFG
          if [ "${{ inputs.ksu_variant }}" != "None" ]; then
            scripts/config --file out/.config -e KSU -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS
            make $MAKE_ARGS olddefconfig
          fi
          make $MAKE_ARGS -j"$(nproc)" 2>&1 | tee ../build.log

      - name: Collect Output
        run: |
          mkdir -p output
          cp kernel/out/arch/arm64/boot/Image* output/
          find kernel/out/arch/arm64/boot/dts -name '*.dtb' -exec cp {} output/ \; 2>/dev/null || true
          ls -lh output

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sapphire-kernel-${{ inputs.ksu_variant }}
          path: output/*

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          
