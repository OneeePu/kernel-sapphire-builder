name: Build Xiaomi Sapphire Kernel
on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel Source Repository'
        required: true
        default: 'https://github.com/The-Angel-Place-Sapphire/kernel_xiaomi_sapphire'
        type: string
      kernel_branch:
        description: 'Kernel Branch'
        required: true
        default: 'main'
        type: string
      defconfig:
        description: 'Kernel Defconfig (auto-detected if blank)'
        required: false
        default: 'vendor/sapphire-perf_defconfig'
        type: string
      clang_version:
        description: 'Clang Toolchain Version'
        required: true
        default: 'r487747c'
        type: choice
        options:
          - 'r487747c'
          - 'r450784d'
          - 'r510928'
          - 'proton-clang'
      ksu_variant:
        description: 'KernelSU Variant'
        required: true
        default: 'KernelSU'
        type: choice
        options:
          - 'KernelSU'
          - 'KernelSU-Next'
          - 'None'
jobs:
  build-kernel:
    name: Build Sapphire Kernel (${{ inputs.ksu_variant }})
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Builder Repo
        uses: actions/checkout@v4
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
